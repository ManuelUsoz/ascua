<section id="bubble" [hidden]="!current()">
  <header>
    <span id="bubble-face"></span>
    <span id="tool">{{ current()?.tool }}</span>
    <span id="queued">{{ queuedText() }}</span>
  </header>
  <pre id="summary">{{ current()?.summary }}</pre>
  <footer>
    <button type="button" class="allow" (click)="decide('allow')">Approve</button>
    <button type="button" class="deny" (click)="decide('deny')">Reject</button>
    <button type="button" class="quiet" (click)="decide('terminal')">In terminal</button>
  </footer>
</section>

<span id="room-ring" aria-hidden="true"></span>

<span id="room-embers" aria-hidden="true">
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
</span>

<section id="room" [attr.aria-hidden]="!open()">
  <header id="room-bar">
    <span>Ascua</span>
    <span class="room-buttons">
      <button class="wbtn" type="button" aria-label="Minimize" (click)="collapse()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M2 11h10" />
        </svg>
      </button>
      <button class="wbtn" type="button" aria-label="Close" (click)="close()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M2.5 2.5l9 9M11.5 2.5l-9 9" />
        </svg>
      </button>
    </span>
  </header>

  <main>
    <h1>
      <span class="pop pop-1">Hello</span>
      <span class="pop pop-2">user!</span>
    </h1>
  </main>
</section>

<div id="ascua-host"></div>
