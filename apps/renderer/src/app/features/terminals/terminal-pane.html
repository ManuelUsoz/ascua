<section class="as-term" [attr.data-kind]="spec() ? 'pista' : 'shell'">
  <div class="as-term__bar">
    <app-icon [name]="spec() ? 'server' : 'terminal'" />
    <b>{{ name() }}</b>
    <app-status [state]="state().state" [label]="state().label" />
    @if (spec(); as spec) {
      @if (spec.port) {
        <span>:{{ spec.port }}</span>
      }
      <span class="as-term__cmd">{{ spec.command }}</span>
      <button
        appButton
        type="button"
        variant="ghost"
        size="s"
        icon
        [attr.aria-label]="
          (running() ? 'terminals.pane.stop' : 'terminals.pane.start')
            | transloco: { name: name() }
        "
        (clicked)="toggle()"
      >
        <app-icon [name]="running() ? 'stop' : 'play'" />
      </button>
      <button
        appButton
        type="button"
        variant="ghost"
        size="s"
        icon
        [attr.aria-label]="'terminals.pane.edit' | transloco: { name: name() }"
        (clicked)="editor.edit(spec)"
      >
        <app-icon name="edit" />
      </button>
    } @else {
      <span class="as-term__cmd"></span>
      @if (!running()) {
        <button
          appButton
          type="button"
          variant="ghost"
          size="s"
          icon
          [attr.aria-label]="
            'terminals.pane.reopen' | transloco: { name: name() }
          "
          (clicked)="toggle()"
        >
          <app-icon name="play" />
        </button>
      }
      <button
        appButton
        type="button"
        variant="ghost"
        size="s"
        icon
        [attr.aria-label]="'terminals.pane.close' | transloco: { name: name() }"
        (clicked)="close()"
      >
        <app-icon name="close" />
      </button>
    }
  </div>
  <div class="as-term__body">
    @if (session()) {
      <app-terminal-view [sessionId]="key()" />
    } @else {
      <p class="as-term__empty">{{ 'terminals.pane.idle' | transloco }}</p>
    }
  </div>
</section>
