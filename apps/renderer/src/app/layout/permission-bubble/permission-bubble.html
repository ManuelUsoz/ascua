<section
  id="bubble"
  [hidden]="!queue.current()"
  [attr.data-source]="queue.current()?.source"
>
  <header>
    <span
      id="bubble-face"
      appCharacter="face"
      [characterAct]="queue.currentAct()"
      [characterPaused]="!queue.current()"
    ></span>
    <span id="tool">
      @if (queue.title(); as title) {
        {{ title.key | transloco: title.params }}
      } @else {
        {{ queue.current()?.tool }}
      }
    </span>
    <span id="queued">
      @if (queue.queuedText(); as queued) {
        {{ queued.key | transloco: queued.params }}
      }
    </span>
  </header>
  <pre id="summary">{{ queue.current()?.summary }}</pre>
  <footer>
    <button type="button" class="allow" (click)="queue.decide('allow')">
      {{ 'bubble.approve' | transloco }}
    </button>
    <button type="button" class="deny" (click)="queue.decide('deny')">
      {{ 'bubble.reject' | transloco }}
    </button>
    @if (!queue.isAssistant()) {
      <button type="button" class="quiet" (click)="queue.decide('terminal')">
        {{ 'bubble.inTerminal' | transloco }}
      </button>
    }
  </footer>
</section>
