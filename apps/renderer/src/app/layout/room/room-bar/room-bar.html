<header id="room-bar" class="as-bar">
  <div class="as-bar__crumbs">
    @if (project(); as p) {
      <b>{{ p.name }}</b>
    } @else {
      <b>Proyectos</b>
    }
    @if (section(); as s) {
      <span>/</span>
      <span>{{ s }}</span>
    }
  </div>
  <span class="room-buttons">
    <button
      class="wbtn"
      type="button"
      aria-label="Minimize"
      (click)="room.collapse()"
    >
      <app-icon name="minimize" />
    </button>
    <button class="wbtn" type="button" aria-label="Close" (click)="close()">
      <app-icon name="close" />
    </button>
  </span>
</header>
