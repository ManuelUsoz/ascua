<span id="room-ring" aria-hidden="true"></span>

<!-- prettier-ignore -->
<span id="room-embers" aria-hidden="true">
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  <span class="ember"></span><span class="ember"></span><span class="ember"></span>
</span>

<section id="room" [attr.aria-hidden]="!room.open()">
  <app-room-bar />
  <div class="as-workbench">
    <app-rail />
    @switch (crumbs().side) {
      @case ('repositories') {
        <app-repository-side />
      }
      @default {
        <app-project-side />
      }
    }
    <main class="as-workbench__main">
      <app-room-crumbs />
      <router-outlet />
    </main>
  </div>
</section>
